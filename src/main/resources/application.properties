# --- MCP server identity -----------------------------------------------------
quarkus.mcp.server.server-info.name=obsidian-mcp
quarkus.mcp.server.server-info.version=${quarkus.application.version}

# --- stdio transport: stdout is reserved for JSON-RPC ------------------------
quarkus.mcp.server.stdio.enabled=true
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
quarkus.log.level=WARN
quarkus.log.category."eu.rossotto.obsidian".level=INFO

# --- native image ------------------------------------------------------------
# Tune for the CPU of the build machine (Apple Silicon). Remove to build a portable binary.
quarkus.native.additional-build-args=-march=native
