name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: mvn -B -ntp verify

      - name: Smoke test (JVM, stdio)
        run: scripts/smoke-test.sh java -jar target/quarkus-app/quarkus-run.jar
